[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fireplanner"
version = "0.1.0"
description = "Swing/position trading research and monitoring stack for S&P 500 index and single names, wired to Interactive Brokers"
# 3.10 is the floor because every published release of ib_async — the library
# that opens the socket to TWS/IB Gateway — is requires-python >=3.10, and
# nobody installs this without the broker connection.
#
# The rest of the package genuinely does run on 3.9: the full suite is green on
# 3.9.23 / pandas 2.3.3, because it exercises the model against committed
# snapshots and never imports ib_async. That made 3.9 look supportable when it
# was not. Declaring the real floor here means pip says so in one line instead
# of failing later inside the extras resolution, where the message names every
# rejected version in the tree and not the requirement that caused it.
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# TWS / IB Gateway socket API (the local, full-featured path).
gateway = ["ib_async>=1.0"]
# Client Portal Web API path (REST, no desktop app required).
web = ["requests>=2.31"]
cache = ["pyarrow>=14.0"]
dev = ["pytest>=7.4"]

[project.scripts]
fireplanner = "fireplanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
