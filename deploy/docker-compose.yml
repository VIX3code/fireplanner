# Two-tier deployment: a private generator that holds the broker connection,
# and a static file server for its output.
#
#   ib-gateway   the only container that talks to IBKR. Never expose 4001/4002.
#   fireplanner  regenerates the static site on a schedule.
#   web          serves the generated files, behind auth.
#
# The gateway is the reason this cannot be serverless: IBKR's API needs a
# long-lived authenticated desktop process, not an API key.

services:
  ib-gateway:
    # Community image that bundles IB Gateway + IBC (automated login/restart).
    # Pin the tag: IBKR ships breaking gateway updates without warning.
    image: ghcr.io/gnzsnz/ib-gateway:10.30
    restart: unless-stopped
    environment:
      TWS_USERID: ${IB_USER}
      TWS_PASSWORD: ${IB_PASSWORD}
      TRADING_MODE: ${IB_MODE:-paper}      # paper | live
      READ_ONLY_API: "yes"                 # blocks order entry at the gateway
      TWOFA_TIMEOUT_ACTION: restart
      AUTO_RESTART_TIME: "11:45 PM"        # IBKR forces a daily re-auth anyway
      TZ: ${TZ:-America/New_York}
    # Bound to the internal network only. Exposing this to the internet would
    # hand over the account, so there is no ports: mapping here on purpose.
    expose:
      - "4001"
      - "4002"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${IB_PORT:-4002} || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  fireplanner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      ib-gateway:
        condition: service_healthy
    environment:
      FIREPLANNER_PROVIDER: gateway
      IB_HOST: ib-gateway
      IB_PORT: ${IB_PORT:-4002}
      IB_CLIENT_ID: ${IB_CLIENT_ID:-17}
      # Set REDACT=--redact whenever the output is reachable by anyone but you.
      REDACT: ${REDACT:---redact}
      SYMBOLS: ${SYMBOLS:-SPY}
      CORE: ${CORE:-0.40}
      TZ: ${TZ:-America/New_York}
    volumes:
      - site:/site
      - cache:/app/.cache
    networks: [internal]

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, public]

networks:
  internal:
    internal: true      # no egress; the gateway is unreachable from outside
  public:

volumes:
  site:
  cache:
  caddy_data:
  caddy_config:
