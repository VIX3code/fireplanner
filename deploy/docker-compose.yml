# Two-tier deployment: private containers that hold the broker connection, and
# Caddy in front of them for TLS and a password.
#
#   ib-gateway   the only container that talks to IBKR. Never publish its ports.
#   fireplanner  regenerates the static analysis site on a schedule.
#   swing-desk   the live Swing Desk: the guardian (stops, targets, ratchet) and
#                its dashboard, connected to IBKR all day. Served at /desk/.
#   web          Caddy: TLS, basic auth, the static site and the /desk/ proxy.
#
# The gateway is the reason this cannot be serverless: IBKR's API needs a
# long-lived authenticated desktop process, not an API key.
#
# Networks: `internal` joins the containers to each other and has no route
# out. `egress` gives the gateway (it must reach IBKR to log in) and the two
# apps (Telegram, earnings dates) a way out, with no ports published, so
# nothing on the internet can reach them. Only `web` publishes ports.

services:
  ib-gateway:
    # Community image that bundles IB Gateway + IBC (automated login/restart).
    # Pin the tag: IBKR ships breaking gateway updates without warning.
    image: ghcr.io/gnzsnz/ib-gateway:10.30
    restart: unless-stopped
    environment:
      TWS_USERID: ${IB_USER}
      TWS_PASSWORD: ${IB_PASSWORD}
      TRADING_MODE: ${IB_MODE:-paper}      # paper | live
      # "yes" blocks every order at the gateway. The analysis site never needs
      # orders; the Swing Desk needs "no" once trading.enabled is true.
      READ_ONLY_API: ${IB_READ_ONLY_API:-yes}
      TWOFA_TIMEOUT_ACTION: restart
      AUTO_RESTART_TIME: "11:45 PM"        # IBKR forces a daily re-auth anyway
      TZ: ${TZ:-America/New_York}
    # IB Gateway only accepts connections from its own 127.0.0.1; the image
    # relays them on 4003 (live) and 4004 (paper) for the other containers.
    # There is deliberately no ports: mapping: exposing these hands over the account.
    expose:
      - "4003"
      - "4004"
    networks: [internal, egress]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${IB_PORT:-4004} || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  fireplanner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      ib-gateway:
        condition: service_healthy
    environment:
      FIREPLANNER_PROVIDER: gateway
      IB_HOST: ib-gateway
      IB_PORT: ${IB_PORT:-4004}            # 4004 paper, 4003 live (the gateway's relay ports)
      IB_CLIENT_ID: ${IB_CLIENT_ID:-17}
      # Set REDACT=--redact whenever the output is reachable by anyone but you.
      REDACT: ${REDACT:---redact}
      SYMBOLS: ${SYMBOLS:-SPY}
      CORE: ${CORE:-0.40}
      # Optional. Set both and the generator pushes to Telegram when the
      # decision changes; leave either blank and it stays silent.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TZ: ${TZ:-America/New_York}
    volumes:
      - site:/site
      - cache:/app/.cache
    networks: [internal, egress]

  swing-desk:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      ib-gateway:
        condition: service_healthy
    entrypoint: ["/usr/bin/tini", "--"]
    # Dry run until trading.enabled is true in config/config.yaml; paper until
    # trading.allow_live is true. The guardian refuses a live account otherwise.
    command:
      - fireplanner
      - --host
      - ib-gateway
      - --port
      - "${IB_PORT:-4004}"
      - trade
      - run
      - --config
      - /app/config/config.yaml
      - --dash-host
      - 0.0.0.0
      - --dash-port
      - "8765"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      # A second lock behind Caddy's password. Open the page once as /desk/?token=...
      FIREPLANNER_DASH_TOKEN: ${FIREPLANNER_DASH_TOKEN:-}
      TZ: ${TZ:-America/New_York}
    volumes:
      # The journal (trades, stop-outs, settings): keep this volume, back it up.
      - trading:/app/data/trading
      # Your rules. Edit config/config.yaml and restart this container.
      - ../config:/app/config:ro
    expose:
      - "8765"
    networks: [internal, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_HASH: ${AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, public]

networks:
  internal:
    internal: true      # container to container only; no route out
  egress: {}            # outbound only: nothing is published on it
  public: {}

volumes:
  site:
  cache:
  trading:
  caddy_data:
  caddy_config:
