# FirePlanner configuration.
#
# Every value here is also a CLI flag or a dataclass field; this file is the
# convenient place to keep a setup you actually trade rather than retyping flags.

data:
  provider: snapshot          # snapshot | gateway | web
  snapshots_root: data/snapshots
  lookback_days: 1260         # ~5 years of daily bars
  cache: true
  cache_root: .cache/bars
  throttle_seconds: 0.3       # IBKR allows ~60 historical requests / 10 min

  gateway:
    host: 127.0.0.1
    port: 4002                # 7496 TWS live · 7497 TWS paper · 4001/4002 Gateway
    client_id: 17
    readonly: true            # blocks order entry at the connection level

  web:
    base_url: https://localhost:5000/v1/api
    verify: false             # CP gateway serves a self-signed cert on localhost

universe:
  benchmark: SPY
  vol_symbol: VIX             # CBOE index — needs exchange=CBOE, not SMART
  breadth_symbol: RSP         # equal-weight S&P, the participation proxy
  term_symbol: VIX3M          # 3-month VIX — curve shape and fast re-entry
  watchlist:
    - SPY
    - NVDA
    - ZS
    - MP
    - FTNT

regime:
  weights:                    # renormalized automatically if an input is missing
    trend: 0.40
    vol: 0.25
    breadth: 0.20
    drawdown: 0.15
    # VIX3M/VIX is contrarian (backwardation is bullish) and predicts forward
    # returns monotonically -- but weighting it INSIDE the trend gate measured
    # strictly worse (Sharpe 1.18 -> 0.96 -> 0.69). It pays as a re-entry
    # trigger instead. Raise this only if you re-measure it.
    term: 0.00
  vix_calm: 16.0
  vix_stress: 25.0
  # score -> maximum fraction of equity deployable
  bands:
    Risk-On: 1.00             # >= 0.80
    Constructive: 0.75        # >= 0.60
    Neutral: 0.50             # >= 0.40
    Defensive: 0.25           # >= 0.20
    Risk-Off: 0.00

signals:
  weights:
    trend: 0.35
    momentum: 0.30
    entry: 0.20
    quality: 0.15
  buy_threshold: 65.0
  add_threshold: 55.0
  reduce_threshold: 40.0
  min_adx: 18.0               # below this the tape is chop; score is capped
  extended_rsi: 78.0          # entry quality collapses above this
  extended_atr: 3.0           # ATRs above the 21-EMA that count as chasing

# The decision layer: how much of the index to hold today.
allocation:
  core_weight: 0.40           # permanent, never sold
  sleeve_max: 0.60            # tactical exposure stacked on top
  steps: [0.0, 0.25, 0.50, 0.75, 1.0]
  # Schmitt trigger: separate thresholds up and down. The gap is the dead band
  # that stops a score loitering on a boundary from generating trades.
  ladder_up:   [48, 58, 68, 78]
  ladder_down: [40, 50, 60, 70]
  score_smoothing: 10         # EMA span before laddering (raw score sd is ~4.9/day)
  cooldown_days: 21           # sessions before REVERSING direction; continuation is free
  break_confirm_days: 2       # consecutive closes below the 50-day to force the sleeve flat
  reentry_confirm_days: 21    # after a forced exit. Lowering it measured worse - see the docstring
  min_trade_pct: 0.05         # skip rebalances smaller than this
  hard_exit_below_sma50: true
  urgent_exit_bypasses_cooldown: true
  # Measured on the shipped snapshot: 7.6 target changes/yr, 3.2% reversed
  # within 10 sessions, 33 rebalances in 5 years costing $33.

risk:
  risk_pct: 0.0075            # fraction of equity risked per position
  atr_stop_mult: 2.5          # initial stop distance, in ATRs
  atr_trail_mult: 3.0         # chandelier trail once the position is working
  max_position_pct: 0.10      # cap for a diversified book
  max_portfolio_heat: 0.06    # cap on summed open risk across all positions
  max_gross_exposure: 1.00
  target_vol: 0.15
  min_notional: 500.0
  whole_shares: true

backtest:
  initial_equity: 100000.0
  commission_per_share: 0.0035   # IBKR tiered US equities
  min_commission: 1.00
  slippage_bps: 2.0
  entry_score: 65.0
  exit_score: 45.0
  exit_on_sma50_break: true
  exit_on_supertrend_flip: true
  # Permanent, never-sold allocation. 0.0 is a pure tactical book, which on the
  # shipped sample captured 0 of SPY's 20 best days. 0.4 captures all 20 and
  # still beats buy-and-hold on Sharpe and drawdown.
  core_weight: 0.00
  # Re-enter at a lower score once the VIX curve un-inverts: best days cluster
  # within days of worst days, so a slow re-entry guarantees you miss them.
  fast_reentry: true
  reentry_score: 45.0
  # Single-instrument tests override max_position_pct: that 10% cap is a
  # diversification rule, and applying it here would leave 90% in cash and make
  # the buy-and-hold comparison meaningless.
  position_cap_pct: 1.00

# ---------------------------------------------------------------------------
# Trade management: `fireplanner trade ...`
#
# The guardian places a GTC stop and a target on every position the moment it
# fills (bought from the dashboard or directly in TWS / the IBKR app), moves
# the stop up as the trade works, and never moves it down.
# ---------------------------------------------------------------------------
trading:
  enabled: false              # false = dry run: every order is logged, none is sent
  allow_live: false           # refuse the live ports (4001 / 7496) until true
  journal: data/trading/journal.sqlite   # trade history; keep it, never commit it
  guardian:
    client_id: 23             # fixed, so a restarted guardian can still move its own stops
    interval_seconds: 30      # a fill wakes it immediately; this is the heartbeat
  dashboard:
    host: 127.0.0.1           # put it behind deploy/Caddyfile to reach it from a phone
    port: 8765

  # Sizing: the LOSS is fixed, the size follows. Each position is sized so a
  # stop-out costs risk_per_trade_usd (before gaps): a calm stock with a 3%
  # stop gets a bigger position than a volatile one with a 5% stop.
  risk_per_trade_usd: 250
  max_position_usd: 10000     # cap on any one position (or add), however tight its stop
  max_invested_usd: 100000    # cap on the whole book at cost
  max_slots: 20               # most positions open at once
  round_up: true              # round shares / lots up...
  max_round_up_overshoot: 0.20  # ...unless that adds >20% to the loss; then round down
  base_currency: USD

  # Stop: the tighter of max_stop_pct and atr_stop_mult x the average daily range.
  max_stop_pct: 0.05
  atr_stop_mult: 2.5
  outside_rth: false          # stops trigger in regular trading hours only
  # Ratchet: to the entry price at +5%, then trail 3 ATRs under the high. Never down.
  breakeven_at: 0.05
  atr_trail_mult: 3.0
  take_half_at_target: true   # sell half at the target, trail the rest

  # Two strikes: after a stop-out you may re-enter once; two in a row lock the stock.
  max_strikes: 2
  lockout_days: null          # null = locked until you unlock it; or a number of trading days
  strike_loss_pct: 0.005      # exits within 0.5% of entry are scratches, not strikes

  # One add to a winner (stop already at entry or better), sized for the same fixed loss.
  allow_add: true
  max_adds: 1

  # Time stop: flag a position that hasn't reached +5% within 4 weeks.
  # The weeks can also be changed on the dashboard.
  time_stop_weeks: 4
  time_stop_min_gain: 0.05
  time_stop_action: alert     # alert = flag it and you decide; sell = sell it automatically

  # Earnings: warn (or block) new buys this close to a report.
  earnings_warn_days: 7
  earnings_block: false

  # Market weather: multiplier on the fixed loss for new buys, per market. 0 blocks.
  weather_sizing: {Risk-On: 1.0, Constructive: 1.0, Neutral: 1.0, Defensive: 0.5, Risk-Off: 0.0}
  breadth_weight: 0.25        # share of the weather score from breadth (% of big stocks above 20/50/200-day)
  breadth:
    per_cycle: 8              # basket stocks fetched per cycle (IBKR allows ~60 history requests / 10 min)
    baskets: {}               # override a market's basket, e.g. {US: [AAPL, MSFT, ...]}; defaults in trading/breadth.py
  weather:                    # index proxy per market
    US: SPY
    LSE: ISF:LN
    SEHK: 2800:HK
    SGX: ES3:SG
    TSEJ: 1306:JP

  # Concentration.
  max_per_sector: 4           # positions in one IBKR industry group (or a theme you set)
  max_open_risk_usd: 5000     # most the book may lose if every stop hits at once
  swing_guide: 0.50           # warn when Volatile drives >50% of the daily swing
  one_position_per_stock: true

  # Circuit breakers: pause NEW buys. Open positions keep their stops.
  daily_loss_limit_usd: 750
  weekly_loss_limit_usd: 1500
  max_consecutive_losses: 3   # stop-outs in a row, any stocks: pause until you resume
  max_entries_per_day: 10

  entry_limit_buffer: 0.005   # a dashboard buy is a limit 0.5% above the last price

  # Stock types. max_atr = average daily range (fraction of price) below which a
  # stock is suggested for that type. cap = most open positions of that type.
  buckets:
    steady:   {name: Steady,   max_atr: 0.020, target: 0.10, cap: 10}
    core:     {name: Core,     max_atr: 0.035, target: 0.15, cap: 10}
    volatile: {name: Volatile, max_atr: null,  target: 0.20, cap: 7}

  # Starting watchlist; add more on the dashboard or with `fireplanner trade watch`.
  # A bare ticker is US. Others: 700:HK, D05:SG, 7203:JP, HSBA:LN.
  watchlist: [NVDA, ZS, MP, FTNT]
  # Hong Kong board lots differ per stock. IBKR usually reports them; set any it doesn't.
  lot_sizes: {}
  # Only used if IBKR can't quote the rate. USD per 1 unit.
  fx_fallback: {GBP: 1.27, HKD: 0.128, SGD: 0.77, JPY: 0.0067}
